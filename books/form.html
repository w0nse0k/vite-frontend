<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/css/style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bookstore</title>
  </head>
  <body>
    <div id="header"></div>
    <div id="main">
      <h3>책 등록</h3>
      <form id="form1" class="w-100">
        <ul>
          <li>
            <input
              type="text"
              name="title"
              placeholder="제목"
              class="w-100"
              required
              autofocus
            />
          </li>
          <li>
            <input
              type="number"
              name="price"
              placeholder="가격"
              class="w-100"
              required
            />
          </li>
          <li>
            <textarea
              name="description"
              class="w-100 h-10rem"
              placeholder="설명"
            ></textarea>
          </li>
          <li>
            <input
              type="text"
              name="image"
              class="w-100"
              placeholder="이미지"
            />
          </li>
          <li><button type="submit">등록</button></li>
        </ul>
      </form>
      <p id="msg" class="warning"></p>
    </div>
    <script type="module" src="/src/pages/books/form.ts"></script>
  </body>
</html>
